<title>공부길</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 채점 노트. 좌측 색인 사이드바 + 모눈종이 본문. 파랑 잉크(행동), 형광펜(강조), 빨간 펜(오답)만 포인트로 쓴다. 모바일에서는 상단 탭 스트립. */
:root{
  --bg:#EEF1F6; --grid:rgba(47,75,216,.05); --surface:#FFFFFF; --surface2:#F5F7FB;
  --ink:#141B34; --ink2:#4A5372; --muted:#5F6785; --line:#DCE1EC; --line2:#C5CCDD;
  --accent:#2F4BD8; --accent-ink:#FFFFFF; --accent-soft:#E3E8FD; --hl-line:#FFE66D;
  --red:#D4333B; --red-soft:#FBE5E6; --good:#006300; --good-soft:#DDF3DD; --warn-soft:#FFF1CC;
  --s-math:#2a78d6; --s-kor:#eb6834; --s-eng:#1baf7a; --s-sci:#eda100; --s-soc:#e87ba4;
  --f-display:"Do Hyeon","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322; --grid:rgba(138,160,255,.05); --surface:#161C31; --surface2:#1C2340;
    --ink:#EDF0FA; --ink2:#B1B9D2; --muted:#8F97B3; --line:#2A3252; --line2:#3A446A;
    --accent:#8AA0FF; --accent-ink:#0E1322; --accent-soft:#232C57; --hl-line:rgba(255,214,10,.34);
    --red:#FF7A80; --red-soft:#3A1F27; --good:#0ca30c; --good-soft:#16301C; --warn-soft:#3B3216;
    --s-math:#3987e5; --s-kor:#d95926; --s-eng:#199e70; --s-sci:#c98500; --s-soc:#d55181;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322; --grid:rgba(138,160,255,.05); --surface:#161C31; --surface2:#1C2340;
  --ink:#EDF0FA; --ink2:#B1B9D2; --muted:#8F97B3; --line:#2A3252; --line2:#3A446A;
  --accent:#8AA0FF; --accent-ink:#0E1322; --accent-soft:#232C57; --hl-line:rgba(255,214,10,.34);
  --red:#FF7A80; --red-soft:#3A1F27; --good:#0ca30c; --good-soft:#16301C; --warn-soft:#3B3216;
  --s-math:#3987e5; --s-kor:#d95926; --s-eng:#199e70; --s-sci:#c98500; --s-soc:#d55181;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink2)}
.sm{font-size:13px}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;padding-block:22px 64px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:36px;height:36px;flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:27px;line-height:1.1;display:block}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.role{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.role button{border:0;background:transparent;border-radius:7px;padding:7px 4px;font-size:13px;font-weight:500;color:var(--ink2)}
.role button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;letter-spacing:.1em;color:var(--muted);margin:14px 10px 4px;font-family:var(--f-mono)}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:500;font-size:14px}
.nav button:hover{background:var(--surface)}
.nav button[aria-current=page]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav .lb{padding:0 2px}
.nav button[aria-current=page] .lb{background:linear-gradient(transparent 58%,var(--hl-line) 58%)}
.bd{font-family:var(--f-mono);font-size:11px;padding:0 7px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);line-height:1.6;white-space:nowrap}
.bd.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.ph h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.6vw,40px);line-height:1.2}
.ph h1 span{background:linear-gradient(transparent 60%,var(--hl-line) 60%);padding:0 .12em}
.ph p{margin-top:6px;color:var(--ink2);max-width:64ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
.banner{background:var(--warn-soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card>h2,.ch{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.kpi .l{font-size:13px;color:var(--ink2)}
.kpi .v{font-family:var(--f-display);font-size:36px;line-height:1.15;margin:2px 0}
.kpi .v small{font-size:16px;font-family:var(--f-body);color:var(--ink2)}
.dl{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.dl.up{color:var(--good)}.dl.dn{color:var(--red)}.dl.eq{color:var(--ink2)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:8px 14px;font-weight:500;font-size:14px;display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:38px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line2);color:var(--ink2)}
.btn.s{padding:3px 10px;font-size:13px;min-height:30px}
.in{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px;color:var(--ink)}
textarea.in{resize:vertical;min-height:88px;line-height:1.5}
.lab{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);min-width:0;flex:1 1 140px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center;color:var(--ink2);min-height:30px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;display:inline-block}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px;flex:none;margin:0}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.tb{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tb th{text-align:left;font-weight:500;font-size:12.5px;color:var(--ink2);padding:6px 8px;border-bottom:1px solid var(--line2)}
.tb td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
.stamp{display:inline-block;font-family:var(--f-display);font-size:14px;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:0 7px;transform:rotate(-4deg);line-height:1.5;white-space:nowrap}
.stamp.ok{color:var(--good);border-color:var(--good);border-radius:99px;transform:none}
.todo{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.todo:last-child{border-bottom:0}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.todo .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--red)}
.cols{display:flex;align-items:stretch;gap:10px;height:200px;position:relative}
.col{flex:1;min-width:0;position:relative;display:flex;align-items:flex-end;justify-content:center;border-radius:6px}
.col .stackbar{width:min(100%,38px);display:flex;flex-direction:column-reverse;gap:2px}
.col .seg{background:var(--c);min-height:2px}
.col .seg:last-child{border-radius:4px 4px 0 0}
.col .tot{position:absolute;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--ink2)}
.dayl{display:flex;gap:10px;margin-top:6px}
.dayl span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.dayl span.t{color:var(--ink);font-weight:600}
.goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--line2);pointer-events:none}
.goal span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--muted);background:var(--surface);padding-left:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;gap:5px;align-items:center}
#lc{width:100%;position:relative}
#lc svg{display:block;max-width:100%}
.gl{stroke:var(--line)}.ax{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}.lbl{fill:var(--ink2);font-size:12px}
.tip{position:fixed;z-index:50;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px;pointer-events:none;max-width:240px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.tip .tt{font-weight:600;margin-bottom:4px}.tip .tr{display:flex;align-items:center;gap:6px}.tip .tr b{margin-left:auto;font-family:var(--f-mono);padding-left:12px;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:92vw}
.days{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day h3{font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}
.ring{display:block;margin:0 auto;max-width:100%}
.ring circle{fill:none;stroke-width:10}
.clock{font-family:var(--f-mono);font-size:34px;font-weight:500;letter-spacing:.02em}
.thumb{width:96px;height:96px;border-radius:8px;border:1px solid var(--line);object-fit:cover;background:repeating-linear-gradient(transparent 0 15px,var(--line) 15px 16px);flex:none}
.item{display:flex;gap:12px;align-items:flex-start}
.item>div{min-width:0;flex:1}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2)}
.q label{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.q.ok{border-color:var(--good)}.q.no{border-color:var(--red)}
.unit{display:flex;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap}
.steps{display:inline-flex;gap:3px}
.steps i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line2);background:transparent}
.steps i.on{background:var(--accent);border-color:var(--accent)}
.tl li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.tl li.past{color:var(--muted)}
.tl b{font-family:var(--f-mono);font-size:12.5px;min-width:46px}
.pad{padding:14px}
body[data-role=guardian] .so{display:none!important}
body[data-role=student] .go{display:none!important}
body[data-ai=off] .ai{display:none!important}
body[data-ai=on] .ainote{display:none!important}
body[data-img=off] .img{display:none!important}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px;padding-top:12px}
  .side{display:contents}
  .nav{flex-direction:row;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px max(16px,env(safe-area-inset-left,0px));margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));border-bottom:1px solid var(--line);scrollbar-width:none}
  .nav .grp{display:none}
  .nav button{white-space:nowrap;flex:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" style="stroke:var(--red)" stroke-width="3" stroke-linecap="round" stroke-dasharray="86 16" transform="rotate(-30 20 20)"/><path d="M12 21l6 6 11-14" fill="none" style="stroke:var(--accent)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>공부길</b><small>중·고등 학습 관리</small></div>
    </div>
    <div class="role" id="roleSw" role="group" aria-label="사용자 모드"></div>
    <nav class="nav" id="nav" aria-label="메뉴"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="tip" id="tip" hidden role="tooltip"></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const TI=iso(TODAY);
const DOW=['일','월','화','수','목','금','토'];
const dDiff=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const weekStart=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const weekDates=off=>{const b=addDays(weekStart(TODAY),off*7);return [0,1,2,3,4,5,6].map(i=>iso(addDays(b,i)))};
const fmtMD=s=>{const d=parseD(s);return (d.getMonth()+1)+'.'+d.getDate()+'('+DOW[d.getDay()]+')'};
const dday=s=>{const n=dDiff(s,TI);return n===0?'D-DAY':n>0?'D-'+n:'D+'+(-n)};
const fmtMin=m=>{m=Math.round(m);if(m<60)return m+'분';return Math.floor(m/60)+'시간'+(m%60?' '+(m%60)+'분':'')};

const SUBJ=[{n:'국어',c:'var(--s-kor)'},{n:'수학',c:'var(--s-math)'},{n:'영어',c:'var(--s-eng)'},{n:'과학',c:'var(--s-sci)'},{n:'사회',c:'var(--s-soc)'}];
const subj=n=>SUBJ.find(s=>s.n===n)||SUBJ[0];
const sw=n=>'<i class="sw" style="--c:'+subj(n).c+'"></i>';
const subjOpts=sel=>SUBJ.map(s=>'<option'+(s.n===sel?' selected':'')+'>'+s.n+'</option>').join('');
const WHY=['개념 부족','계산 실수','문제 해석','시간 부족','찍어서 틀림'];

function seed(){
  const d=n=>iso(addDays(TODAY,n));
  const SS=[[-6,'수학',70],[-6,'영어',40],[-5,'국어',60],[-5,'과학',50],[-4,'수학',90],[-4,'영어',30],[-4,'사회',40],[-3,'과학',60],[-3,'국어',45],[-2,'수학',80],[-2,'영어',50],[-1,'사회',50],[-1,'국어',40],[-1,'수학',60],[0,'영어',35],[0,'수학',45]];
  const U=(arr)=>arr.map((t,i)=>({t:t,st:i%4}));
  return {v:1,role:'student',view:'dashboard',student:{name:'김하늘',grade:'고1'},goalMin:240,
    timer:{on:false,at:0,acc:0,s:'수학',pomo:false},
    scores:[
      {l:'1학기 중간',s:'1중간','국어':78,'수학':64,'영어':82,'과학':70,'사회':75},
      {l:'1학기 기말',s:'1기말','국어':80,'수학':69,'영어':84,'과학':72,'사회':79},
      {l:'9월 모의',s:'9월모의','국어':76,'수학':72,'영어':88,'과학':68,'사회':81},
      {l:'2학기 중간',s:'2중간','국어':83,'수학':74,'영어':86,'과학':77,'사회':80},
      {l:'주간 모의',s:'주간모의','국어':85,'수학':79,'영어':90,'과학':74,'사회':84}],
    sessions:SS.map(a=>({id:uid(),d:d(a[0]),s:a[1],m:a[2]})),
    tasks:[
      [-4,'수학','이차함수 유형 문제 20개',60,1],[-4,'영어','관계대명사 단어 20개',20,1],[-3,'과학','화학 반응식 개념 정리',40,1],
      [-2,'수학','오답 3문제 다시 풀기',30,1],[-1,'국어','현대시 정리표 작성',45,1],[-1,'사회','시장 균형 개념 복습',30,0],
      [0,'수학','닫힌 구간 최대·최소 5문제',40,0],[0,'영어','본문 낭독 + 빈칸 복원',25,1],[0,'과학','오답: 화학 반응식 계산',30,0],
      [1,'국어','비문학 지문 2개 (타이머)',30,0],[1,'사회','자료 해석 문제 5개',30,0],[2,'수학','주간 모의 대비 오답 총정리',60,0],[2,'영어','문법 서술형 영작',30,0]

function drawLine(){
  const el=$('#lc');if(!el)return;
  const W=Math.max(280,el.clientWidth),H=250,m={l:30,r:58,t:12,b:30},rows=S.scores,vis=SUBJ.filter(s=>UI.vis.has(s.n));
  if(!vis.length){el.innerHTML='<p class="muted pad">표시할 과목을 선택해 주세요.</p>';return}
  const vals=[];vis.forEach(s=>rows.forEach(r=>vals.push(r[s.n])));
  let hi=Math.min(100,Math.ceil((Math.max(...vals)+3)/10)*10),lo=Math.floor((Math.min(...vals)-5)/10)*10;if(hi-lo<20)lo=hi-20;
  const n=rows.length,x=i=>m.l+(n===1?0:i*(W-m.l-m.r)/(n-1)),y=v=>m.t+(hi-v)*(H-m.t-m.b)/(hi-lo);
  let g='';
  for(let v=lo;v<=hi;v+=10)g+='<line class="gl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(m.l-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  rows.forEach((r,i)=>{g+='<text class="ax" x="'+x(i)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(r.s)+'</text>'});
  vis.forEach(s=>{const pts=rows.map((r,i)=>x(i)+','+y(r[s.n]));g+='<polyline points="'+pts.join(' ')+'" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="stroke:'+s.c+'"/>';rows.forEach((r,i)=>{g+='<circle cx="'+x(i)+'" cy="'+y(r[s.n])+'" r="4" stroke-width="2" style="fill:'+s.c+';stroke:var(--surface)"/>'})});
  const ends=vis.map(s=>({s:s,y:y(rows[n-1][s.n])})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;
  ends.forEach(e=>{g+='<rect x="'+(W-m.r+10)+'" y="'+(e.y-4)+'" width="8" height="8" rx="2" style="fill:'+e.s.c+'"/><text class="lbl" x="'+(W-m.r+22)+'" y="'+(e.y+4)+'">'+e.s.n+'</text>'});
  g+='<line id="lcx" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke-dasharray="3 3" visibility="hidden" style="stroke:var(--line2)"/><rect id="lcov" x="'+(m.l-10)+'" y="0" width="'+(W-m.l-m.r+20)+'" height="'+(H-m.b)+'" fill="transparent"/>';
  el.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="과목별 점수 추이 꺾은선 그래프">'+g+'</svg>';
  const ov=$('#lcov',el),cx=$('#lcx',el);
  const mv=e=>{const r=el.getBoundingClientRect();let i=Math.round((e.clientX-r.left-m.l)/(((W-m.l-m.r)/(n-1))||1));i=Math.max(0,Math.min(n-1,i));cx.setAttribute('x1',x(i));cx.setAttribute('x2',x(i));cx.setAttribute('visibility','visible');
    showTip('<div class="tt">'+esc(rows[i].l)+'</div>'+vis.slice().sort((a,b)=>rows[i][b.n]-rows[i][a.n]).map(s=>'<div class="tr"><i class="sw" style="--c:'+s.c+'"></i>'+s.n+'<b>'+rows[i][s.n]+'</b></div>').join(''),e)};
  ov.addEventListener('pointermove',mv);ov.addEventListener('pointerdown',mv);ov.addEventListener('pointerleave',()=>{cx.setAttribute('visibility','hidden');hideTip()});
}

function lessonLocal(s,tu,ti,notes){

function localMemo(text){
  const M=[['두문자 암기','핵심어의 첫 글자를 따서 한 문장으로 만들어 외워요'],['비교표','헷갈리는 개념을 2열 표로 나누고 차이만 적어요'],['백지 복습','덮고 떠오르는 대로 쓴 뒤 빠진 것만 색펜으로 채워요'],['이야기 연결','순서가 있는 내용을 짧은 이야기로 이어 외워요']];
  return text.split(/[\n,;·]/).map(x=>x.trim()).filter(Boolean).slice(0,8).map((t,i)=>({name:t,points:[],method:M[i%4][0],how:M[i%4][1]}));

function autoLocal(){
  const L=S.scores[S.scores.length-1],sc=n=>L[n]-pending().filter(w=>w.s===n).length*3;
  const pr=SUBJ.map(s=>s.n).sort((a,b)=>sc(a)-sc(b)),days=weekDates(UI.weekOff).filter(d=>d>=TI),out=[];

    case 'tk':{const t=S.tasks.find(x=>x.id===id);if(t){t.done=el.checked;save();render()}return}
    case 'tkdel':S.tasks=S.tasks.filter(x=>x.id!==id);save();render();return;
    case 'tkadd':{const t=$('#tk-t').value.trim();if(!t){toast('할 일을 입력해 주세요.');return}S.tasks.push({id:uid(),d:$('#tk-d').value,s:$('#tk-s').value,t:t,m:+$('#tk-m').value,done:false});$('#tk-t').value='';save();render();return}
    case 'week':UI.weekOff=el.dataset.n==='0'?0:UI.weekOff+(+el.dataset.n);render();return;
    case 'autoplan':autoPlan();return;
    case 'tmsub':S.timer.s=v;save();render();return;
    case 'tmtoggle':{const t=S.timer;if(t.on){t.acc+=Date.now()-t.at;t.on=false}else{t.at=Date.now();t.on=true}save();render();return}
    case 'tmsave':{const t=S.timer,e=t.acc+(t.on?Date.now()-t.at:0),m=Math.round(e/60000);if(m<1){toast('1분 이상 공부하면 기록할 수 있어요.');return}S.sessions.push({id:uid(),d:TI,s:t.s,m:m});t.on=false;t.acc=0;save();render();toast(subj(t.s).n+' '+fmtMin(m)+' 기록했어요.');return}
    case 'tmreset':S.timer.on=false;S.timer.acc=0;save();render();return;
    case 'pomo':S.timer.pomo=el.checked;save();render();return;
    case 'ssdel':S.sessions=S.sessions.filter(x=>x.id!==id);save();render();return;
    case 'msadd':{const m=Math.max(1,Math.min(600,+$('#ms-m').value||0));S.sessions.push({id:uid(),d:TI,s:$('#ms-s').value,m:m});save();render();return}
    case 'goal':S.goalMin=+el.value;save();render();return;
    case 'lsadd':{const n=$('#ls-n').value.trim(),ti=$('#ls-ti').value.trim();if(!n&&!ti){toast('수업 주제나 메모를 입력해 주세요.');return}S.lessons.push(lessonLocal($('#ls-s').value,$('#ls-tu').value.trim(),ti,n));$('#ls-n').value='';$('#ls-ti').value='';save();render();return}
    case 'lsai':lessonAI();return;
    case 'hw':{const l=S.lessons.find(x=>x.id===id);if(l){l.hw[+el.dataset.i].done=el.checked;save();render()}return}
    case 'lsdel':S.lessons=S.lessons.filter(x=>x.id!==id);save();render();return;
    case 'wf':UI.wf=v;render();return;
    case 'wradd':addWrong(!!el.dataset.ai);return;
    case 'wrst':{const w=S.wrongs.find(x=>x.id===id);if(w){w.st=w.st==='review'?'done':'review';save();render()}return}
    case 'wrai':{const w=S.wrongs.find(x=>x.id===id);if(w)run('wr'+id,()=>analyze(w,null));return}
    case 'wrdel':S.wrongs=S.wrongs.filter(x=>x.id!==id);save();render();return;
    case 'mmmake':makeMemo();return;
    case 'mkstart':mkStart(el.dataset.src);return;
    case 'mkpick':UI.mock.ans[+el.dataset.i]=+el.dataset.j;return;
    case 'mksubmit':{const m=UI.mock;if(!m.ans.some(x=>x!==undefined)){toast('답을 하나 이상 골라 주세요.');return}m.sc=m.qs.filter((q,i)=>m.ans[i]===q.a).length;m.sub=true;S.mockHist.push({id:uid(),d:TI,s:m.s,sc:m.sc,n:m.qs.length,u:m.u});save();render();return}
    case 'mkreset':UI.mock=null;render();return;
    case 'mkwrong':{const m=UI.mock,q=m.qs[+el.dataset.i];S.wrongs.push({id:uid(),s:m.s,u:m.u||'모의 테스트',d:TI,why:'개념 부족',memo:'모의 테스트: '+q.q,st:'review',img:null,ai:null});save();render();toast('오답노트에 추가했어요.');return}
    case 'unit':{const e=S.exams.find(x=>x.id===id);if(e){const u=e.subs[+el.dataset.si].units[+el.dataset.ui];u.st=(u.st+1)%4;save();render()}return}
    case 'exdel':S.exams=S.exams.filter(x=>x.id!==id);save();render();return;
    case 'exadd':{
      const name=$('#ex-n').value.trim(),d=$('#ex-d').value,subs=[];
      $('#ex-r').value.split('\n').forEach(line=>{const m=line.split(/[:：]/);if(m.length<2)return;const sn=m[0].trim();if(!SUBJ.some(s=>s.n===sn))return;const us=m.slice(1).join(':').split(/[,，]/).map(x=>x.trim()).filter(Boolean);if(us.length)subs.push({s:sn,range:us.join(', '),units:us.map(t=>({t:t,st:0}))})});
      if(!name||!d||!subs.length){toast('이름, 날짜, “과목: 단원, 단원” 형식의 범위를 입력해 주세요.');return}
      S.exams.push({id:uid(),name:name,d:d,subs:subs});$('#ex-n').value='';$('#ex-r').value='';save();render();return}
    case 'pstep':{const p=S.perf.find(x=>x.id===id);if(p){p.steps[+el.dataset.i].done=el.checked;save();render()}return}
    case 'pdel':S.perf=S.perf.filter(x=>x.id!==id);save();render();return;
    case 'pfadd':perfAdd(!!el.dataset.ai);return;
    case 'stsub':UI.st=v;render();return;
    case 'diag':diagnose();return;
    case 'comment':{const t=$('#cm-t').value.trim();if(!t){toast('내용을 입력해 주세요.');return}S.comments.push({id:uid(),who:$('#cm-who').value,d:TI,t:t});save();render();return}
    case 'reset':if(!UI.cr){UI.cr=true;render();setTimeout(()=>{UI.cr=false;render()},4000)}else{UI.cr=false;S=seed();save();render();toast('예시 데이터로 초기화했어요.')}return;
  }
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a]');if(!b||b.disabled)return;if(b.tagName==='INPUT'||b.tagName==='SELECT')return;act(b.dataset.a,b)});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='wr-f'){const f=el.files&&el.files[0];if(f){UI.pend.wf=f;UI.pend.wt=await thumb(f,800);render()}return}
  if(el.id==='mm-f'){const fs=[].slice.call(el.files||[],0,3);UI.pend.mf=fs;UI.pend.mt=(await Promise.all(fs.map(f=>thumb(f,320)))).filter(Boolean);render();return}
  if(el.dataset&&el.dataset.a&&(el.tagName==='INPUT'||el.tagName==='SELECT'))act(el.dataset.a,el);
});
/* tooltip events */
const tipT=e=>e.target.closest&&e.target.closest('[data-tip]');
document.addEventListener('pointerover',e=>{const t=tipT(e);if(t)showTip(TIPS[+t.dataset.tip],e)});
document.addEventListener('pointermove',e=>{const t=tipT(e);if(t&&!tipEl.hidden)placeTip(e)});
document.addEventListener('pointerout',e=>{const t=tipT(e);if(t&&!t.contains(e.relatedTarget))hideTip()});
document.addEventListener('pointerdown',e=>{if(!tipT(e)&&!(e.target.id==='lcov'))hideTip()});
document.addEventListener('focusin',e=>{const t=tipT(e);if(t){const r=t.getBoundingClientRect();showTip(TIPS[+t.dataset.tip],{clientX:r.left+r.width/2,clientY:r.top})}});
document.addEventListener('focusout',e=>{if(tipT(e))hideTip()});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawLine,150)});
/* boot */
S=load();render();setInterval(tickTimer,1000);initAI();
})();
</script>
